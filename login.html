<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">

    <title>Autentificare - Workforce Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>

    @keyframes fadeUp {

        from {
            opacity: 0;
            transform: translateY(40px) scale(.98);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

    }

    .login-card{
        animation:fadeUp .8s cubic-bezier(.2,.8,.2,1);
        will-change: transform, opacity;
    }
    @keyframes floatBlob{

    0%{
    transform:translate(0,0);
    }

    50%{
    transform:translate(10px,-12px);
    }

    100%{
    transform:translate(0,0);
    }

    }

    .bgblob{
    animation:floatBlob 18s ease-in-out infinite;
    }

    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/global-footer.css">
    <script src="js/project-version.js"></script>
    <script src="js/discord-config.js"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="min-h-screen overflow-hidden bg-slate-950 text-slate-100 font-sans antialiased relative">
    <!-- Fundal -->
    <div class="absolute inset-0 overflow-hidden -z-10">

        <div class="bgblob absolute -top-40 -left-40 w-96 h-96 rounded-full bg-indigo-600/20 blur-3xl"></div>

        <div class="bgblob absolute top-1/2 -right-32 w-[30rem] h-[30rem] rounded-full bg-cyan-500/10 blur-3xl"></div>

        <div class="bgblob absolute bottom-0 left-1/3 w-[28rem] h-[28rem] rounded-full bg-violet-500/10 blur-3xl"></div>

    </div>

    <div class="relative min-h-screen flex items-center justify-center p-6">
    <!-- Card de Autentificare -->
    <div class="login-card w-full max-w-lg rounded-3xl border border-slate-700/60 bg-slate-900/70 backdrop-blur-xl shadow-[0_0_60px_rgba(59,130,246,0.15)] p-10 text-center space-y-8">
    <div class="space-y-3">

    <div class="inline-flex flex-col items-center gap-3">

        <div class="flex items-center justify-center w-20 h-20 rounded-3xl bg-gradient-to-br from-indigo-500/20 to-cyan-500/20 border border-indigo-400/30 text-4xl shadow-lg shadow-indigo-500/20">
            🔐
        </div>

        <span class="rounded-full border border-indigo-400/20 bg-indigo-500/10 px-4 py-1 text-xs font-semibold uppercase tracking-[0.25em] text-indigo-300">
            Secure Access
        </span>

    </div>

        <h1 class="text-4xl font-black tracking-tight">
            Panel
        </h1>

        <p class="text-sm uppercase tracking-[0.35em] text-slate-500">
            Management System
        </p>

        <p class="text-slate-400 leading-relaxed max-w-sm mx-auto">
            Conectează-te în siguranță cu contul tău Discord pentru a accesa panoul de management.
        </p>

    </div>

        <!-- Butonul de Login Discord -->
        <button
            id="discord-login-btn"
            class="group w-full rounded-2xl border border-indigo-400/20 bg-gradient-to-r from-[#5865F2] to-[#4752C4] px-6 py-5 transition-all duration-500 hover:-translate-y-1 hover:scale-[1.015] hover:shadow-[0_12px_40px_rgba(88,101,242,0.45)] active:translate-y-0 active:scale-[0.985]">

            <div class="flex items-center justify-between">

                <div class="flex items-center gap-4">

                    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-white/10">
                        <svg class="w-6 h-6 fill-current text-white" viewBox="0 0 24 24">
                            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028z"/>
                        </svg>
                    </div>

                    <div class="text-left">
                        <div class="text-lg font-bold text-white">
                            Discord
                        </div>

                        <div class="text-sm text-indigo-100">
                            Conectare securizată OAuth2
                        </div>
                    </div>

                </div>

                <div class="text-2xl text-white transition-all duration-500 group-hover:translate-x-2 group-hover:scale-110">
                    →
                </div>

            </div>

        </button>

    <div class="space-y-5">

        <div class="rounded-2xl border border-slate-700/40 bg-slate-800/40 p-4">

            <div class="flex flex-wrap items-center justify-center gap-4 text-sm">

                <div class="flex items-center gap-2 text-emerald-400">
                    <span>✓</span>
                    <span class="text-slate-300">OAuth2</span>
                </div>

                <div class="w-px h-4 bg-slate-700"></div>

                <div class="flex items-center gap-2 text-cyan-400">
                    <span>🛡️</span>
                    <span class="text-slate-300">Rol sincronizat</span>
                </div>

                <div class="w-px h-4 bg-slate-700"></div>

                <div class="flex items-center gap-2 text-violet-400">
                    <span>⚡</span>
                    <span class="text-slate-300">Permisiuni live</span>
                </div>

            </div>

        </div>

        <p
            id="status-msg"
            class="min-h-[24px] text-sm font-medium text-indigo-300 transition-all duration-300">
        </p>

    </div>
    </div>
    </div>
    <!-- Script de Autentificare și Sincronizare Supabase -->
    <script>
        const SUPABASE_URL = window.PANEL_SUPABASE_CONFIG.url;
        const SUPABASE_KEY = window.PANEL_SUPABASE_CONFIG.publishableKey;
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let CLIENT_ID = window.PANEL_DISCORD_CONFIG.clientId;
        const DISCORD_SCOPES = window.PANEL_DISCORD_CONFIG.scopes.join(' ');
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        function getLoginDestination(user) {
            const permissionLevel = Number(user?.permission_level);

            if (Number.isInteger(permissionLevel) && permissionLevel === 0) {
                return 'guest.html';
            }

            return 'index.html';
        }

        document.getElementById('discord-login-btn').addEventListener('click', async () => {
            try {
                const { data } = await supabaseClient.rpc('get_discord_oauth_config');
                if (data?.[0]?.discord_client_id) CLIENT_ID = data[0].discord_client_id;
            } catch (_) {
                // Configurația locală rămâne fallback pentru prima instalare.
            }
            const discordAuthUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(DISCORD_SCOPES)}`;
            window.location.href = discordAuthUrl;
        });

        document.addEventListener('DOMContentLoaded', async () => {
            const hash = window.location.hash;
            
            // Dacă avem token în hash (venit de la Discord)
            if (hash && hash.includes('access_token')) {
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                const oauthState = params.get('state');

                // Loginul Android folosește pagina web drept callback aprobat de Discord,
                // apoi revine în aplicație prin schema mobilă înregistrată în Android.
                if (accessToken && oauthState === 'panel_android') {
                    // Fragmentele URL (#...) pot fi eliminate de Android la deschiderea
                    // unei aplicații. Mutăm temporar valorile în query string.
                    const mobileParams = new URLSearchParams();
                    ['access_token', 'token_type', 'expires_in', 'scope', 'state'].forEach(key => {
                        const value = params.get(key);
                        if (value) mobileParams.set(key, value);
                    });
                    const appCallback = `discord-1531023771211792384:/authorize/callback?${mobileParams.toString()}`;
                    const loginButton = document.getElementById('discord-login-btn');
                    const returnButton = document.createElement('a');
                    returnButton.href = appCallback;
                    returnButton.className = loginButton.className;
                    returnButton.innerHTML = '<span>Revino în aplicația Panel</span>';
                    loginButton.replaceWith(returnButton);
                    document.getElementById('status-msg').textContent = 'Autentificarea a reușit. Se redeschide aplicația...';
                    setTimeout(() => { window.location.href = appCallback; }, 250);
                    return;
                }

                if (accessToken) {
                    // Curățăm URL-ul imediat să prevenim buclele
                    window.history.replaceState({}, document.title, window.location.pathname);
                    setLoginStatus("🔄 Se inițiază autentificarea...");
                    await processDiscordLogin(accessToken);
                }
            } else {
                // Dacă nu suntem în timpul callback-ului, verificăm dacă utilizatorul are deja sesiune validă
                const existingUser = localStorage.getItem('discord_user');

                if (existingUser) {
                    try {
                        const parsed = JSON.parse(existingUser);

                        if (parsed && parsed.discord_id) {
                            window.location.href = getLoginDestination(parsed);
                            return;
                        }
                    } catch (error) {
                        console.error('Sesiune locală invalidă:', error);
                        localStorage.clear();
                    }
                }
            }
        });
        function setLoginStatus(message) {
            const status = document.getElementById("status-msg");

            status.style.opacity = 0;

            setTimeout(() => {
                status.textContent = message;
                status.style.opacity = 1;
            }, 150);
        }
        async function processDiscordLogin(token) {
            try {
                const response = await fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Eșec la preluarea profilului de pe Discord.');
                const discordData = await response.json();

                if (!discordData.id) {
                    throw new Error('Profil Discord invalid.');
                }

                setLoginStatus("🛡️ Se verifică rolul pe server...");

                const syncResponse = await fetch(`${SUPABASE_URL}/functions/v1/sync-discord-role`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        apikey: SUPABASE_KEY,
                        authorization: `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({ access_token: token })
                });
                const syncResult = await syncResponse.json();
                if (!syncResponse.ok || !syncResult.user) {
                    throw new Error(syncResult.error || 'Rolul Discord nu a putut fi verificat.');
                }

                const syncedUser = syncResult.user;
                localStorage.setItem('discord_user', JSON.stringify(syncedUser));
                localStorage.setItem('user_role', syncedUser.role);
                localStorage.setItem('discord_access_token', token);

                setLoginStatus(`✅ Rol sincronizat: ${syncedUser.role}`);

                setTimeout(() => {
                    const returnAfterLogin =
                        sessionStorage.getItem('panel_return_after_login');

                    sessionStorage.removeItem('panel_return_after_login');

                    const defaultDestination = getLoginDestination(syncedUser);

                    window.location.href =
                        returnAfterLogin || defaultDestination;
                }, 400);

                return;


            } catch (err) {
                console.error('Erore login:', err);
                document.getElementById('status-msg').textContent = `Eroare autentificare: ${err.message || 'eroare necunoscută'}`;
                localStorage.clear();
            }
        }
    </script>
    <script src="js/global-footer.js"></script>
</body>
</html>
