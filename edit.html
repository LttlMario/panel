<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Vizual & Coordonate - Familia Es Todo</title>
    <script src="js/permissions.js"></script>
    <script src="js/panel-layout.js"></script>
    <style>
        :root {
            --bg-main: #0b1220;
            --bg-panel: #131c2b;
            --bg-panel-hover: #1c283f;
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --danger: #ff5555;
            --success: #46d369;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-radius: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Stil pentru ecranul de acces interzis */
        #auth-lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-main);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 15px;
            text-align: center;
            padding: 20px;
        }

        #auth-lock-screen h2 {
            color: var(--danger);
            font-size: 24px;
        }

        #auth-lock-screen p {
            color: var(--text-muted);
            font-size: 14px;
        }

        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        header h1 {
            font-size: 15px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            flex: 1;
            height: calc(100vh - 55px);
            overflow: hidden;
        }

        .sidebar-panel {
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            padding: 15px;
            gap: 12px;
        }

        .tabs {
            display: flex;
            background: var(--bg-main);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn.active {
            background: var(--bg-panel-hover);
            color: var(--text-main);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .tab-content.active {
            display: flex;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-group input, .form-group textarea, .form-group select {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .map-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .map-container {
            position: absolute;
            cursor: crosshair;
            transform-origin: 0 0;
            will-change: transform;
        }

        .map-container img {
            display: block;
            width: 2560px;
            height: 2560px;
            max-width: none;
            pointer-events: none;
        }

        .map-pin {
            position: absolute;
            width: 80px;
            height: 80px;
            transform: translate(-50%, -100%) scale(var(--pin-scale, 1));
            transform-origin: bottom center;
            background: var(--bg-panel);
            border: 3px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 20px var(--accent-glow);
            cursor: pointer;
            z-index: 50;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .map-pin.active-editing {
            border-color: var(--success);
            box-shadow: 0 0 30px rgba(70, 211, 105, 0.5);
            z-index: 60;
        }

        .map-pin.is-dragging {
            cursor: grabbing;
        }

        /* Radius Circle */
        .pin-radius-circle {
            position: absolute;
            transform: translate(-50%, -50%);
            border: 2px dashed var(--accent);
            background: var(--accent-glow);
            border-radius: 50%;
            pointer-events: none;
            z-index: 40;
            display: none;
        }

        .pin-list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .pin-item-card {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .pin-item-card:hover {
            border-color: var(--accent);
            background: var(--bg-panel-hover);
        }

        .pin-item-card.selected {
            border-color: var(--success);
            background: rgba(70, 211, 105, 0.05);
        }

        .pin-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }

        .pin-card-details {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
        }

        .editor-footer {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 14px;
            border-radius: var(--border-radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            flex: 1;
            text-align: center;
        }

        .btn:hover {
            border-color: var(--accent);
            background: var(--bg-panel-hover);
        }

        .btn-primary {
            background: var(--accent);
            color: #0b1220;
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-danger {
            background: rgba(255, 85, 85, 0.15);
            color: var(--danger);
            border-color: rgba(255, 85, 85, 0.3);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }

        #toast-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-panel);
            border: 1px solid var(--accent);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: var(--border-radius);
            font-size: 13px;
            font-weight: 600;
            box-shadow: var(--shadow);
            animation: fadeInOut 2.5s ease forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
    </style>
    <link rel="stylesheet" href="css/global-footer.css">
    <script src="js/project-version.js"></script>
</head>
<body>

    <!-- Ecran de blocare pentru acces restricționat -->
    <div id="auth-lock-screen">
        <h2>⛔ Acces Restricționat</h2>
        <p>Această pagină necesită drepturi de <strong>Administrator</strong> pentru a fi accesată.</p>
    </div>

    <header>
        <h1>🗺️ Advanced Map Editor & Pin Manager</h1>
        <div class="header-actions">
            <button class="btn" style="padding: 6px 12px; font-size: 11px;" onclick="triggerImportJSON()">📂 Import JSON</button>
            <button class="btn btn-primary" style="padding: 6px 12px; font-size: 11px;" onclick="exportAllJSON()">💾 Export Tot (JSON)</button>
            <input type="file" id="import-file-input" style="display: none;" accept=".json" onchange="handleFileImport(event)">
        </div>
    </header>

    <div class="main-layout">
        <div class="sidebar-panel">
            <!-- Navigation Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('editor')">Editor Pin</button>
                <button class="tab-btn" onclick="switchTab('list')">Listă Pinuri (<span id="pin-count">1</span>)</button>
            </div>

            <!-- Tab 1: Editor / Formular -->
            <div id="tab-editor" class="tab-content active">
                <div class="form-group">
                    <label>Selectare Hartă</label>
                    <select id="edit-map" onchange="switchMap()">
                        <option value="ls">Los Santos & Blaine County (gtav.jpg)</option>
                        <option value="cayo">Cayo Perico (cayo.jpg)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Model Pin (Categorii)</label>
                    <select id="pin-model-select" onchange="changePinModel()">
                        <option value="🚐|#f59e0b">🚐 Livrări & Rulote</option>
                        <option value="🏥|#3b82f6">🏥 Spitale & Medical</option>
                        <option value="🌿|#46d369">🌿 Droguri & Marijuana</option>
                        <option value="🌿|#10b981">🌿 Cocaină</option>
                        <option value="⚙️|#ff5555">⚙️ Arme & Craftare</option>
                        <option value="🧪|#a855f7">🧪 Substanțe & Chimie</option>
                        <option value="⭐|#00d4ff">⭐ Speciale / Puncte Importante</option>
                        <option value="📍|#ffffff">📍 Standard / Generic</option>
                        <option value="⚓|#0284c7">⚓ Port / Maritim</option>
                        <option value="💰|#eab308">💰 Achiziții / Finanțe</option>
                        <option value="🔥|#ef4444">🔥 Activități ilegale / Tortură</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ID Unic / Cheie Locație</label>
                    <input type="text" id="edit-loc-id" value="loc-noua-1">
                </div>
                <div class="form-group">
                    <label>Titlu Locație</label>
                    <input type="text" id="edit-title" value="Punct Nou Hartă" placeholder="Ex: Rulotă Murrieta" oninput="updateActivePinField()">
                </div>
                <div class="form-group">
                    <label>Categorie Atlas</label>
                    <select id="edit-category">
                        <option value="deliveries">Livrări & Rulote</option>
                        <option value="hospitals">Spitale & Medical</option>
                        <option value="drugs">Droguri & Procesare</option>
                        <option value="weapons">Arme & Craftare</option>
                        <option value="suppliers">Achiziții & Altele</option>
                    </select>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Coordonata X (%)</label>
                        <input type="text" id="edit-x" value="50.0" onchange="manualCoordInput()">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Coordonata Y (%)</label>
                        <input type="text" id="edit-y" value="50.0" onchange="manualCoordInput()">
                    </div>
                </div>

                <!-- Jump to Game Coords -->
                <div class="form-group">
                    <label>Sari la Coordonate Joc (X, Y FiveM)</label>
                    <div style="display: flex; gap: 6px;">
                        <input type="text" id="jump-x" placeholder="X de joc">
                        <input type="text" id="jump-y" placeholder="Y de joc">
                        <button class="btn" style="flex: unset; padding: 0 12px;" onclick="jumpToGameCoords()">Salt</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Rază Vizuală Cerc (metri / 0 = Inactiv)</label>
                    <input type="number" id="edit-radius" value="0" min="0" step="5" oninput="updateRadiusUI()">
                </div>

                <div class="form-group">
                    <label>Descriere</label>
                    <textarea id="edit-description" rows="2" placeholder="Detalii despre locație..."></textarea>
                </div>
                <div class="form-group">
                    <label>Cerințe & Note</label>
                    <input type="text" id="edit-requirements" placeholder="Ex: Licență, Rang, etc.">
                </div>
                <div class="form-group">
                    <label>Nume Imagine Fișier</label>
                    <input type="text" id="edit-images" value="image_6d67a5.jpg">
                </div>

                <div class="editor-footer">
                    <button class="btn" onclick="addNewPinToList()">➕ Adaugă ca Nou</button>
                    <button class="btn btn-primary" onclick="exportSingleJSON()">💾 Copiază JSON</button>
                </div>
            </div>

            <!-- Tab 2: Lista Pinurilor Salvate -->
            <div id="tab-list" class="tab-content">
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="search-filter" placeholder="Caută în pinuri..." style="flex:1; background:var(--bg-main); border:1px solid var(--border-color); padding:8px; border-radius:8px; color:#fff; font-size:13px;" oninput="renderPinList()">
                    <button class="btn btn-danger" style="flex: unset; padding: 0 10px;" onclick="clearAllPins()" title="Șterge tot">🗑️</button>
                </div>
                <div class="pin-list-container" id="pin-list-element">
                    <!-- Dinamic populate -->
                </div>
            </div>

            <div style="margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-color); display: flex; gap: 10px;">
                <button class="btn" onclick="resetView()">Centrează Hartă</button>
            </div>
        </div>

        <div class="map-viewport" id="map-viewport">
            <div class="map-container" id="map-container">
                <img src="img/gtav.jpg" alt="Harta Hartă" id="map-img">
                <div class="pin-radius-circle" id="map-radius-circle"></div>
                <!-- Toate pinurile de pe hartă vor fi randate aici dinamic -->
                <div id="pins-canvas-layer"></div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // --- VERIFICARE ROL ADMIN ---
        function checkAdminAccess() {
            const storedUser = getUser();
            const isUserAdmin = Boolean(storedUser && getRole() >= Roles.ADMIN);

            if (!isUserAdmin) {
                window.location.href = '403.html';
                return;
            } else {
                document.getElementById('auth-lock-screen').style.display = 'none';
            }
        }

        // Rulăm verificarea imediat la pornire
        checkAdminAccess();

        // Stare aplicație
        let pins = [
            {
                id: 'loc-noua-1',
                map: 'ls',
                category: 'deliveries',
                title: 'Punct Nou Hartă',
                description: '',
                images: ['image_6d67a5.jpg'],
                x: 50.0,
                y: 50.0,
                requirements: '',
                icon: '🚐',
                color: '#f59e0b',
                radius: 0,
                lastUpdated: new Date().toISOString().split('T')[0]
            }
        ];

        let activePinIndex = 0;

        let scale = 0.35;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let startX = 0;
        let startY = 0;
        let draggingPinIndex = null;

        const viewport = document.getElementById('map-viewport');
        const mapContainer = document.getElementById('map-container');
        const mapImg = document.getElementById('map-img');
        const pinsCanvasLayer = document.getElementById('pins-canvas-layer');
        const radiusCircle = document.getElementById('map-radius-circle');

        function updateTransform() {
            mapContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            
            const baseScale = 0.35;
            const dynamicPinScale = Math.max(0.3, Math.min(2.5, baseScale / scale));
            
            document.querySelectorAll('.map-pin').forEach(p => {
                p.style.setProperty('--pin-scale', dynamicPinScale);
            });
            updateRadiusUI();
        }

        function resetView() {
            const vWidth = viewport.clientWidth;
            const vHeight = viewport.clientHeight;
            scale = 0.35;
            panX = (vWidth - (2560 * scale)) / 2;
            panY = (vHeight - (2560 * scale)) / 2;
            updateTransform();
        }

        function switchMap() {
            const mapSelect = document.getElementById('edit-map').value;
            pins[activePinIndex].map = mapSelect;
            if (mapSelect === 'cayo') {
                mapImg.src = 'cayo.jpg';
            } else {
                mapImg.src = 'gtav.jpg';
            }
            mapImg.onload = () => {
                resetView();
                renderPins();
            };
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            if (tabName === 'editor') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-editor').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-list').classList.add('active');
                renderPinList();
            }
        }

        function changePinModel() {
            const val = document.getElementById('pin-model-select').value;
            const [icon, color] = val.split('|');
            pins[activePinIndex].icon = icon;
            pins[activePinIndex].color = color;
            renderPins();
        }

        function syncFormToActivePin() {
            const p = pins[activePinIndex];
            if (!p) return;

            document.getElementById('edit-map').value = p.map || 'ls';
            document.getElementById('edit-loc-id').value = p.id;
            document.getElementById('edit-title').value = p.title;
            document.getElementById('edit-category').value = p.category || 'deliveries';
            document.getElementById('edit-x').value = p.x.toFixed(1);
            document.getElementById('edit-y').value = p.y.toFixed(1);
            document.getElementById('edit-description').value = p.description || '';
            document.getElementById('edit-requirements').value = p.requirements || '';
            document.getElementById('edit-images').value = (p.images || ['image_6d67a5.jpg']).join(', ');
            document.getElementById('edit-radius').value = p.radius || 0;

            const select = document.getElementById('pin-model-select');
            for (let opt of select.options) {
                if (opt.value.includes(p.icon)) {
                    select.value = opt.value;
                    break;
                }
            }

            if (p.map === 'cayo' && mapImg.src !== 'cayo.jpg') {
                mapImg.src = 'cayo.jpg';
            } else if (p.map !== 'cayo' && mapImg.src !== 'gtav.jpg') {
                mapImg.src = 'gtav.jpg';
            }

            renderPins();
        }

        function syncInputToPinObj() {
            const p = pins[activePinIndex];
            if (!p) return;

            p.id = document.getElementById('edit-loc-id').value.trim();
            p.title = document.getElementById('edit-title').value.trim();
            p.map = document.getElementById('edit-map').value;
            p.category = document.getElementById('edit-category').value;
            p.description = document.getElementById('edit-description').value.trim();
            p.requirements = document.getElementById('edit-requirements').value.trim();
            const imgRaw = document.getElementById('edit-images').value.trim();
            p.images = imgRaw ? imgRaw.split(',').map(s => s.trim()) : ['image_6d67a5.jpg'];
            p.radius = parseFloat(document.getElementById('edit-radius').value) || 0;
            p.lastUpdated = new Date().toISOString().split('T')[0];
        }

        ['edit-loc-id', 'edit-title', 'edit-category', 'edit-description', 'edit-requirements', 'edit-images', 'edit-radius', 'edit-map'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                syncInputToPinObj();
                renderPins();
            });
        });

        function updateActivePinField() {
            syncInputToPinObj();
            renderPins();
        }

        function manualCoordInput() {
            const p = pins[activePinIndex];
            p.x = Math.max(0, Math.min(100, parseFloat(document.getElementById('edit-x').value) || 0));
            p.y = Math.max(0, Math.min(100, parseFloat(document.getElementById('edit-y').value) || 0));
            renderPins();
        }

        function jumpToGameCoords() {
            const jx = parseFloat(document.getElementById('jump-x').value);
            const jy = parseFloat(document.getElementById('jump-y').value);
            if (isNaN(jx) || isNaN(jy)) {
                showToast('Introduceți coordonate valide!');
                return;
            }
            const percentX = ((jx + 3000) / 8500) * 100;
            const percentY = ((jy - 4000) / -10000) * 100;

            const p = pins[activePinIndex];
            p.x = Math.max(0, Math.min(100, percentX));
            p.y = Math.max(0, Math.min(100, percentY));

            syncFormToActivePin();
            showToast('S-a sărit la coordonatele specificate!');
        }

        function renderPins() {
            pinsCanvasLayer.innerHTML = '';
            const imgWidth = 2560;
            const imgHeight = 2560;

            pins.forEach((p, idx) => {
                const pinEl = document.createElement('div');
                pinEl.className = `map-pin ${idx === activePinIndex ? 'active-editing' : ''}`;
                pinEl.textContent = p.icon || '📍';
                pinEl.style.borderColor = p.color || '#fff';
                pinEl.style.color = p.color || '#fff';

                const px = (p.x / 100) * imgWidth;
                const py = ((100 - p.y) / 100) * imgHeight;

                pinEl.style.left = `${px}px`;
                pinEl.style.top = `${py}px`;

                pinEl.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    activePinIndex = idx;
                    syncFormToActivePin();
                    draggingPinIndex = idx;
                    pinEl.classList.add('is-dragging');
                });

                pinsCanvasLayer.appendChild(pinEl);
            });

            document.getElementById('pin-count').textContent = pins.length;
            updateRadiusUI();
        }

        function updateRadiusUI() {
            const p = pins[activePinIndex];
            if (!p || !p.radius || p.radius <= 0) {
                radiusCircle.style.display = 'none';
                return;
            }

            const imgWidth = 2560;
            const imgHeight = 2560;
            const px = (p.x / 100) * imgWidth;
            const py = ((100 - p.y) / 100) * imgHeight;
            const radiusInPixels = p.radius * (imgWidth / 8500); 

            radiusCircle.style.display = 'block';
            radiusCircle.style.left = `${px}px`;
            radiusCircle.style.top = `${py}px`;
            radiusCircle.style.width = `${radiusInPixels * 2}px`;
            radiusCircle.style.height = `${radiusInPixels * 2}px`;
        }

        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.map-pin')) return;
            isPanning = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (draggingPinIndex !== null) {
                const rect = mapImg.getBoundingClientRect();
                const clickX = (e.clientX - rect.left) / scale;
                const clickY = (e.clientY - rect.top) / scale;

                const p = pins[draggingPinIndex];
                p.x = Math.max(0, Math.min(100, (clickX / 2560) * 100));
                p.y = Math.max(0, Math.min(100, ((2560 - clickY) / 2560) * 100));

                if (draggingPinIndex === activePinIndex) {
                    document.getElementById('edit-x').value = p.x.toFixed(1);
                    document.getElementById('edit-y').value = p.y.toFixed(1);
                    updateRadiusUI();
                }
                renderPins();
            } else if (isPanning) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            draggingPinIndex = null;
            isPanning = false;
            document.querySelectorAll('.map-pin').forEach(p => p.classList.remove('is-dragging'));
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
            newScale = Math.max(0.1, Math.min(8, newScale));

            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;

            updateTransform();
        }, { passive: false });

        mapContainer.addEventListener('click', (e) => {
            if (e.target.closest('.map-pin') || draggingPinIndex !== null) return;
            const rect = mapImg.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) / scale;
            const clickY = (e.clientY - rect.top) / scale;

            const p = pins[activePinIndex];
            p.x = Math.max(0, Math.min(100, (clickX / 2560) * 100));
            p.y = Math.max(0, Math.min(100, ((2560 - clickY) / 2560) * 100));
            
            document.getElementById('edit-x').value = p.x.toFixed(1);
            document.getElementById('edit-y').value = p.y.toFixed(1);
            renderPins();
        });

        function addNewPinToList() {
            const newPin = {
                id: 'loc-' + Date.now(),
                map: document.getElementById('edit-map').value,
                category: document.getElementById('edit-category').value,
                title: 'Locație Nouă ' + (pins.length + 1),
                description: '',
                images: ['image_6d67a5.jpg'],
                x: 50.0,
                y: 50.0,
                requirements: '',
                icon: '📍',
                color: '#ffffff',
                radius: 0,
                lastUpdated: new Date().toISOString().split('T')[0]
            };
            pins.push(newPin);
            activePinIndex = pins.length - 1;
            syncFormToActivePin();
            showToast('Pin nou adaugat în listă!');
        }

        function renderPinList() {
            const container = document.getElementById('pin-list-element');
            const filter = document.getElementById('search-filter').value.toLowerCase();
            container.innerHTML = '';

            pins.forEach((p, idx) => {
                if (filter && !p.title.toLowerCase().includes(filter) && !p.id.toLowerCase().includes(filter)) {
                    return;
                }

                const card = document.createElement('div');
                card.className = `pin-item-card ${idx === activePinIndex ? 'selected' : ''}`;
                card.innerHTML = `
                    <div class="pin-card-header">
                        <span>${p.icon || '📍'} ${p.title}</span>
                        <div style="display: flex; gap: 4px;" onclick="event.stopPropagation()">
                            <button class="btn" style="padding: 2px 6px; font-size: 11px;" onclick="selectPin(${idx})">Editează</button>
                            <button class="btn btn-danger" style="padding: 2px 6px; font-size: 11px;" onclick="deletePin(${idx})">🗑️</button>
                        </div>
                    </div>
                    <div class="pin-card-details">
                        <span>ID: ${p.id}</span>
                        <span>X: ${p.x.toFixed(1)}%, Y: ${p.y.toFixed(1)}%</span>
                    </div>
                `;
                card.onclick = () => {
                    selectPin(idx);
                };
                container.appendChild(card);
            });
        }

        function selectPin(idx) {
            activePinIndex = idx;
            syncFormToActivePin();
            switchTab('editor');
            showToast(`Selectat pinul: ${pins[idx].title}`);
        }

        function deletePin(idx) {
            if (pins.length <= 1) {
                showToast('Trebuie să existe cel puțin un pin!');
                return;
            }
            pins.splice(idx, 1);
            if (activePinIndex >= pins.length) {
                activePinIndex = pins.length - 1;
            }
            syncFormToActivePin();
            renderPinList();
            showToast('Pin șters cu succes!');
        }

        function clearAllPins() {
            if (confirm('Sigur doriți să ștergeți toate pinurile?')) {
                pins = [{
                    id: 'loc-default-1',
                    map: 'ls',
                    category: 'deliveries',
                    title: 'Punct Principal',
                    description: '',
                    images: ['image_6d67a5.jpg'],
                    x: 50.0,
                    y: 50.0,
                    requirements: '',
                    icon: '🚐',
                    color: '#f59e0b',
                    radius: 0,
                    lastUpdated: new Date().toISOString().split('T')[0]
                }];
                activePinIndex = 0;
                syncFormToActivePin();
                renderPinList();
                showToast('Toate pinurile au fost resetate.');
            }
        }

        function triggerImportJSON() {
            document.getElementById('import-file-input').click();
        }

        function handleFileImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    if (Array.isArray(parsed)) {
                        pins = parsed;
                    } else if (typeof parsed === 'object' && parsed !== null) {
                        pins = [parsed];
                    }
                    activePinIndex = 0;
                    syncFormToActivePin();
                    renderPinList();
                    showToast(`Importate cu succes ${pins.length} pinuri!`);
                } catch (err) {
                    showToast('Eroare: Fișier JSON invalid!');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function exportSingleJSON() {
            syncInputToPinObj();
            const p = pins[activePinIndex];
            const cleanObj = {
                id: p.id,
                map: p.map,
                category: p.category,
                title: p.title,
                description: p.description,
                images: p.images,
                x: parseFloat(p.x.toFixed(1)),
                y: parseFloat(p.y.toFixed(1)),
                requirements: p.requirements,
                radius: p.radius,
                lastUpdated: p.lastUpdated
            };
            copyToClipboard(JSON.stringify(cleanObj, null, 4), 'Obiectul JSON curent a fost copiat în clipboard!');
        }

        function exportAllJSON() {
            const cleanArray = pins.map(p => ({
                id: p.id,
                map: p.map,
                category: p.category,
                title: p.title,
                description: p.description,
                images: p.images,
                x: parseFloat(p.x.toFixed(1)),
                y: parseFloat(p.y.toFixed(1)),
                requirements: p.requirements,
                radius: p.radius,
                lastUpdated: p.lastUpdated
            }));
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanArray, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "map_locations.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();

            showToast('Toate pinurile au fost exportate în fișierul map_locations.json!');
        }

        function copyToClipboard(text, msg) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(msg);
            }).catch(() => {
                showToast('Eroare la copierea în clipboard.');
            });
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        window.addEventListener('load', () => {
            resetView();
            syncFormToActivePin();
            renderPins();
        });
        
        window.addEventListener('resize', () => {
            resetView();
        });
    </script>
    <script src="js/global-footer.js"></script>
</body>
</html>
